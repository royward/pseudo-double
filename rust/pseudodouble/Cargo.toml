[package]
name = "pseudodouble"
version = "1.1.0"
edition = "2021"

[dependencies]
num-traits = "0.2"
simba = "0.10"
approx = "0.5"
fmt = "0.1"

[dev-dependencies]
libm = "0.2.11"
